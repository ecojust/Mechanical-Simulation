name: Release macOS Apple Silicon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to release, for example v0.4.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build macOS arm64
    # macos-15 is the standard Apple Silicon runner; macos-15-intel is x64.
    runs-on: macos-15
    timeout-minutes: 50
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout version tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          architecture: arm64
          cache: npm

      - name: Set up native Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin
          rustc --version

      - name: Verify architecture and release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(node -p 'process.arch')" = arm64
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${pkg.version}`) {
            throw Error('Release tag must be vX.Y.Z and match package.json');
          }
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          if (tauri.version !== pkg.version || !cargo.includes(`version = "${pkg.version}"`)) throw Error('Native and frontend versions differ');
          if (lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw Error('package-lock.json version differs from package.json');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\nversion=${pkg.version}\n`);
          NODE
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify mechanics, project data, and original assets
        run: |
          npm test
          npm run verify:demo
          npm run verify:bayonet
          npm run assets:verify
          npm run verify:puretv-calibration
          npm run verify:puretv-evidence
          cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features

      - name: Build Apple Silicon DMG and ZIP
        run: npm run release:mac

      - name: Verify native architectures, signature, and archive contents
        run: npm run release:mac:verify

      - name: Verify packaged MCP against the official protocol client
        env:
          MCP_TEST_BINARY: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Mechanical Studio.app/Contents/MacOS/mechanical-studio
        run: npm run mcp:test-protocol

      - name: Start packaged application and check the workbench
        run: npm run release:mac:smoke

      - name: Preserve actual packaged controller verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: puretv-macos-mcp-verification-${{ steps.version.outputs.version }}
          path: src-tauri/target/puretv-macos-mcp-verification.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload only the verified Apple Silicon release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Mechanical-Studio-${{ steps.version.outputs.version }}-macos-arm64
          path: |
            release/Mechanical-Studio-${{ steps.version.outputs.version }}-macos-arm64.dmg
            release/Mechanical-Studio-${{ steps.version.outputs.version }}-macos-arm64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish verified macOS arm64 release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Mechanical-Studio-${{ needs.build.outputs.version }}-macos-arm64
          path: release

      - name: Verify checksums and release file allowlist
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS.txt
          test "$(find . -type f | wc -l)" -eq 3
          test -f "Mechanical-Studio-${RELEASE_VERSION}-macos-arm64.dmg"
          test -f "Mechanical-Studio-${RELEASE_VERSION}-macos-arm64.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Mechanical Studio for Apple Silicon (M-series Macs), macOS 13 or later.

          - Lightweight Tauri 2 desktop application using the system WKWebView; no bundled Chromium or Node.js.
          - Typed components, self-contained GLB/STL uploads, required mechanical interaction parameters, and MCP access.
          - Independently editable source parts, mating groups, and per-part PBR color, metalness and roughness.
          - Complete pureTV controller assembled through MCP, with nine spring/button mechanisms and separate indicator lamps.
          - Revised source strikers, guides and shell clearances; hash-bound source geometry checks tied to the exact assembly and tested travel.
          - Contact-driven switch actuator motion, lamp-on press and lamp-off rebound verified inside the packaged application.
          - Compound spring/button and mating mechanisms with coordinated members, press/rebound and checked insertion/rotation.
          - 3D assembly, dimensional checks, mating paths, spring/button and DC circuit verification.
          - Insert-and-turn bayonet pair with a checked 45° locking and reverse removal path.
          - Original pureTV assets, editable assembly projects, and validation reports.

          Download the DMG to install, or the ZIP for the application bundle. Only macOS arm64 packages are published. SHA256SUMS.txt contains both package checksums.

          This build has an ad-hoc signature. It is not Apple Developer ID signed or notarized. macOS may require approval under System Settings → Privacy & Security after the first open attempt. Verify the source and checksum before granting approval; do not disable Gatekeeper globally.

          Source mesh evidence applies only to the matching pureTV assembly and documented sampled paths; edits invalidate it. General components continue to use their declared parameterized proxies. Nominal spring/electrical results are not a manufacturing or material certification.
          NOTES
          dmg="release/Mechanical-Studio-${RELEASE_VERSION}-macos-arm64.dmg"
          zip="release/Mechanical-Studio-${RELEASE_VERSION}-macos-arm64.zip"
          # Never silently replace a published version. Reruns may resume a draft
          # left behind if upload failed, and publish only after all files exist.
          if gh release view "$RELEASE_TAG" --json isDraft,assets > existing-release.json 2>/dev/null; then
            test "$(jq -r .isDraft existing-release.json)" = true || {
              echo 'This version is already published; create a new version tag.' >&2
              exit 1
            }
            jq -e --arg dmg "$(basename "$dmg")" --arg zip "$(basename "$zip")" \
              '[.assets[].name | select(. != $dmg and . != $zip and . != "SHA256SUMS.txt")] | length == 0' \
              existing-release.json
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Mechanical Studio ${RELEASE_VERSION} · macOS Apple Silicon" \
              --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" "$dmg" "$zip" release/SHA256SUMS.txt --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' | grep -qx 3
          gh release edit "$RELEASE_TAG" --notes-file notes.md --draft=false
